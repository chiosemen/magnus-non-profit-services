name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    services:
      # P0-3 (SPEC-P0 R2/R3): ephemeral Postgres 16 so database integration
      # tests are REQUIRED to run in CI instead of silently skipping.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magnus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: '${{ github.event_name == ''pull_request'' && github.event.pull_request.base.sha || github.event.before }}'
          head: '${{ github.event_name == ''pull_request'' && github.event.pull_request.head.sha || github.sha }}'

      - name: Run lint
        run: pnpm -r --if-present lint

      - name: Prisma generate (for typecheck)
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/magnus_ci_typegen?schema=public
        run: pnpm prisma:generate

      - name: Build shared packages (for type resolution)
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/magnus_ci_typegen?schema=public
        run: pnpm --filter "./packages/**" build

      - name: Run typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Apply migrations to ephemeral Postgres (P0-3)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/magnus_test?schema=public
        run: pnpm --filter @magnus/db prisma:deploy

      - name: Run tests
        env:
          # Ephemeral service database only — the R3 guard in the test suites
          # refuses non-loopback hosts, so tests can never reach production.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/magnus_test?schema=public
          # Turn database-unavailable skips into hard failures (R2).
          REQUIRE_DB_TESTS: "1"
          # Deterministic throwaway key for encryption round-trip tests.
          # Not a production secret: CI-local, ephemeral database only (R1).
          ENCRYPTION_KEY: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: pnpm test

      - name: Build
        env:
          REDIS_URL: redis://localhost:6379
        run: pnpm build

      - name: Validate migrations (additive-only)
        run: node scripts/validate-migrations.js

      - name: Prisma generate (unified)
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/magnus_ci_typegen?schema=public
        run: pnpm prisma:generate

  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MCP Connector Image
        run: |
          docker build -t mcp-connector:test -f apps/mcp-connector/Dockerfile .
