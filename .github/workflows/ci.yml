name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: '${{ github.event_name == ''pull_request'' && github.event.pull_request.base.sha || github.event.before }}'
          head: '${{ github.event_name == ''pull_request'' && github.event.pull_request.head.sha || github.sha }}'

      - name: Run lint
        run: pnpm -r --if-present lint

      - name: Prisma generate (for typecheck)
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/magnus_ci_typegen?schema=public
        run: pnpm prisma:generate

      - name: Build shared packages (for type resolution)
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/magnus_ci_typegen?schema=public
        run: pnpm --filter "./packages/**" build

      - name: Run typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Run tests
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm build

      - name: Validate migrations (additive-only)
        run: node scripts/validate-migrations.js

      - name: Prisma generate (unified)
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/magnus_ci_typegen?schema=public
        run: pnpm prisma:generate

  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MCP Connector Image
        run: |
          docker build -t mcp-connector:test -f apps/mcp-connector/Dockerfile .
