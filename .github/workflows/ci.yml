name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/magnus
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: magnus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d magnus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @magnus/db prisma:generate

      - name: Prisma migrate deploy
        run: pnpm --filter @magnus/db prisma:deploy

      - name: Run typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Run integration tests
        run: pnpm test:integration

      - name: Run package smoke tests
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm build

      - name: Validate migrations (additive-only)
        run: node scripts/validate-migrations.js
