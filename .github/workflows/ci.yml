name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10"

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm --filter @magnus/db prisma:generate

      - name: Run typecheck
        run: pnpm -r exec tsc --noEmit

      - name: Run tests
        run: pnpm -r --if-present test

      - name: Build
        run: pnpm build

      - name: Validate migrations (additive-only)
        run: node scripts/validate-migrations.js
