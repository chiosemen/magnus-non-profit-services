# Magnus Accord — agent admission / security policy
# Last amended: 21 Aug 2026 — Cursor merge_authority is a check (when_all), not a boolean.

version: 1

cursor:
  role: primary implementer (was: read-only auditor — changed 20 Aug 2026, Claude Code session limit)
  allowed_actions: [plan, write_code, write_tests, open_pr, merge]
  denied_actions: [deploy, read_client_data, write_secret]
  may_write_paths:
    - "src/**"
    - "apps/**"
    - "packages/**"
    - "scripts/**"
    - "docs/**"
    - "tests/**"
    - ".github/**"
    - ".cursor/**"
    - "SPEC-P0.md"
    - "accord-security-policy.yaml"
    - "README.md"
    - "package.json"
    - "pnpm-workspace.yaml"
    - "tsconfig.json"
    - ".dockerignore"
    - ".gitignore"
  may_not_write_paths:
    - "**/*.key"
    - "**/.env*"
    - "gates/**"
  # Cursor may merge iff scripts/merge-authority.js exits 0.
  # A boolean here is rejected by that check (P0-5).
  merge_authority:
    when_all:
      ci: green
      base: main
      paths_only:
        - "docs/**"

# Mechanical checkers (not agents) — cited for maker≠checker
mechanical_gates:
  - assert-test-count
  - validate-migrations
  - TruffleHog
  - tsc
  - CI
  - merge-authority

orchestrator:
  role: Claude (Cowork) — audit and review
  merge_authority: false
  notes: Reviews diffs; does not replace CI green.
